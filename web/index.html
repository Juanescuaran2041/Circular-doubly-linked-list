<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Honeypot Ring - Moving Target Defense</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Honeypot Ring</h1>
    <p>Circular doubly linked list applied to Moving Target Defense</p>
  </header>

  <main class="layout">
    <section class="panel ring-panel" aria-label="Ring visualization">
      <svg id="ring" viewBox="0 0 500 500" role="img" aria-label="Honeypot ring"></svg>
      <ul class="legend">
        <li><span class="dot exposed"></span> Exposed</li>
        <li><span class="dot waiting"></span> Waiting</li>
        <li><span class="dot isolated"></span> Isolated</li>
        <li><span class="arrow next"></span> next</li>
        <li><span class="arrow prev"></span> prev</li>
      </ul>
    </section>

    <aside class="side">
      <section class="panel" aria-label="Status">
        <h2>Status</h2>
        <dl class="stats">
          <dt>Clock</dt><dd id="clock">0 s</dd>
          <dt>Exposed</dt><dd id="exposed">-</dd>
          <dt>Next rotation</dt><dd id="next-rotation">-</dd>
          <dt>Selected</dt><dd id="selected">none</dd>
        </dl>
        <p id="error" class="error" role="alert" hidden></p>
      </section>

      <section class="panel" aria-label="Rotation controls">
        <h2>Rotation</h2>
        <div class="button-row">
          <button id="btn-back" type="button">&larr; Step back</button>
          <button id="btn-rotate" type="button">Rotate &rarr;</button>
        </div>
        <div class="button-row">
          <button id="btn-time-10" type="button">+10 s</button>
          <button id="btn-time-30" type="button">+30 s</button>
          <button id="btn-auto" type="button" aria-pressed="false">Auto</button>
        </div>
      </section>

      <section class="panel" aria-label="Server actions">
        <h2>Selected server</h2>
        <div class="button-row">
          <button id="btn-attack" type="button" class="danger" disabled>Attack</button>
          <button id="btn-isolate" type="button" disabled>Isolate</button>
          <button id="btn-remove" type="button" disabled>Remove</button>
        </div>
        <div class="button-row">
          <button id="btn-add" type="button">Add honeypot</button>
          <button id="btn-reset" type="button">Reset</button>
        </div>
      </section>

      <section class="panel" aria-label="History">
        <h2>Exposure history</h2>
        <ol id="history" class="history"></ol>
      </section>
    </aside>
  </main>

  <script src="/js/app.js"></script>
</body>
</html>
